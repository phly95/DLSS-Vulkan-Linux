; ffx1.ini — the S8 ffx1 cell (owner: tools/optiharness stage).
; Based on tools/optiharness/OptiScaler.harness.ini with these changes (the seam study's slot
; decision, docs/notes/ffx-seam-plan.md §1 + §8; §8's `Dx12Upscaler=ffx` value was corrected
; against stock v0.9.4 MEASURED behaviour, 2026-11-01 run 10:14):
;
;   [Upscalers] Dx12Upscaler=fsr31
;       NOT `ffx`: stock v0.9.4 has no FFXFeatureDx12 (0 RTTI hits in dxgi.dll) - the `ffx`
;       string maps to Upscaler::FFX, which FeatureProvider_Dx12::GetFeature does not handle,
;       so it fell into the default branch and silently substituted FSR2FeatureDx12_212 (the
;       measured N5-style failure).  `fsr31` maps to FSR31FeatureDx12, whose Evaluate drives
;       the FFX API through FfxApiProxy - the working route to OUR dll.
;   [Libraries] FfxDx12SRPath=Z:\...\build\package\dlss5-amd-ffx.dll
;       FfxApi_Proxy.h SR-slot resolution goes through Util::LoadProxyLibrary, which honours
;       this override FIRST - Opti loads OUR dll by explicit path (log: "Loaded from override
;       path"), and the game's genuine 28,761,864-B amd_fidelityfx_upscaler_dx12.dll in bin64
;       is never shadowed or renamed.
;   [InitFlags] AutoExposure=true
;       THE g3 fix.  Stock's FSR31Feature::Evaluate probes for the exposure texture when
;       AutoExposure is off; with no ExposureTexture (the harness never passes one) it sets
;       State.autoExposure + changeBackend and RETURNS without dispatching (frame 0), then
;       FeatureProvider's ChangeFeature dance eats frames 1-3 (1000 ms sleep + recreate + init)
;       and only frame 4 reaches ffxDispatch - measured: OUT_NZ 0-3 = 0.000000.  With the user
;       override on, SetInitParameters reads Config before the app flag (IFeature.cpp:74-84),
;       frame 0 dispatches immediately, no probe, no "changing backend to" lines (g1-ffx).
;   [Inputs] EnableFfxInputs=false
;       Config.h:758 defaults this TRUE - Opti detours other modules' ffx entry points.  The
;       plan's slot decision: we ARE the SR dll, the main-slot Detour hooks stay off.  Section
;       is [Inputs] (Config.cpp:846 readBool("Inputs", "EnableFfxInputs")), NOT [ffx].
;
; The NvngxPath line stays: the harness template stages _nvngx.dll — the FFX cell drives the
; SAME bridge through a DIFFERENT surface, and NvngxPath documents where the NGX twin lives if
; a fallback ever happened (g1 greps it loaded).  Everything else mirrors
; OptiScaler.harness.ini (LogToFile, CAS off, Sharpness 0, OutputScaling off, update check off).

[Upscalers]
Dx12Upscaler=fsr31

[InitFlags]
AutoExposure=true

[DLSS]
Enabled=true

[Libraries]
NvngxPath=_nvngx.dll
FfxDx12SRPath=Z:\home\deck\DLSS-Vulkan-Linux\build\package\dlss5-amd-ffx.dll

[Inputs]
EnableFfxInputs=false

[Log]
LogToFile=true
LogLevel=1

[Hotfix]
CheckForUpdate=false

[CAS]
Enabled=false
MotionSharpnessEnabled=false

[Sharpness]
OverrideSharpness=false
Sharpness=0

[OutputScaling]
Enabled=false