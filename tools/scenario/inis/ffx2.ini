; ffx2.ini — the S8 ffx2 cell (owner: tools/optiharness stage): the FORKED-Opti route.
; Identical to ffx1.ini except [Upscalers] Dx12Upscaler=dlss5_amd — the fork's first-class
; menu entry (docs/notes/ffx-seam-plan.md §8/§9: tools/optiscaler-fork/patch.sh's 4 hunks —
; Upscaler::DLSS5AMD enum, "DLSS5-AMD" display + "dlss5_amd" ini code, AddDx12Backends combo
; slot, GetFeature routing to FFXFeatureDx12).
;
; The fork dll is staged through the harness's OPTISCALER_SRC override (run_harness.sh), NOT
; copied into the game dir: the game now carries the staged ffx1 in-path Opti and stays
; pristine; the fork is the ONLY variable vs ffx1 — same port dll, same gates, same ini shape.
; NOTE vs plan §9's "same ini minus the override": kept FfxDx12SRPath — the patch routes
; DLSS5AMD to FFXFeatureDx12, which resolves through the SAME FfxApiProxy SR slot (patch
; comment: "the override mechanism stays authoritative"), so dropping the override would make
; the fork cell differ in TWO variables at once.
;
; [InitFlags] AutoExposure=true and [Inputs] EnableFfxInputs=false: same rationale as
; ffx1.ini (no exposure-probe ChangeFeature dance; main-slot Detour hooks off).

[Upscalers]
Dx12Upscaler=dlss5_amd

[InitFlags]
AutoExposure=true

[DLSS]
Enabled=true

[Libraries]
NvngxPath=_nvngx.dll
FfxDx12SRPath=Z:\home\deck\DLSS-Vulkan-Linux\build\package\dlss5-amd-ffx.dll

[Inputs]
EnableFfxInputs=false

[Log]
LogToFile=true
LogLevel=1

[Hotfix]
CheckForUpdate=false

[CAS]
Enabled=false
MotionSharpnessEnabled=false

[Sharpness]
OverrideSharpness=false
Sharpness=0

[OutputScaling]
Enabled=false